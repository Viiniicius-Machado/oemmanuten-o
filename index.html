<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#080808"/>
<title>Netturbo · O&M Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#e8e8e8;font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1.8rem}
.logo-wrap{width:90px;height:90px;border-radius:50%;overflow:hidden;border:2px solid #8bc34a;box-shadow:0 0 30px rgba(139,195,74,.2)}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.title{font-family:Rajdhani,sans-serif;font-size:2rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8bc34a;text-align:center}
.subtitle{font-size:.68rem;color:#505050;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-top:-.6rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:500px}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:#111;border-radius:14px;padding:1.8rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center;text-decoration:none;transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.97)}
.card.tecnico{border:1px solid #1e2e12}
.card.tecnico:hover{box-shadow:0 8px 30px rgba(139,195,74,.12)}
.card.lider{border:1px solid #1e1a08}
.card.lider:hover{box-shadow:0 8px 30px rgba(212,168,67,.12)}
.card-icon{font-size:2.4rem}
.card-title{font-family:Rajdhani,sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.card.tecnico .card-title{color:#8bc34a}
.card.lider .card-title{color:#d4a843}
.card-desc{font-size:.68rem;color:#505050;line-height:1.5}
.card-badge{font-size:.58rem;font-weight:700;letter-spacing:.1em;padding:.22rem .6rem;border-radius:20px}
.card.tecnico .card-badge{background:rgba(139,195,74,.1);color:#8bc34a;border:1px solid rgba(139,195,74,.2)}
.card.lider .card-badge{background:rgba(212,168,67,.1);color:#d4a843;border:1px solid rgba(212,168,67,.2)}
footer{font-size:.6rem;color:#282828;letter-spacing:.1em}
</style>
</head>
<body>
<div class="logo-wrap"><img src="./logo.png" alt="Netturbo"/></div>
<div>
  <div class="title">Netturbo</div>
  <div class="subtitle">Sistema de Relatórios · O&amp;M</div>
</div>
<div class="cards">
  <a class="card tecnico" href="rfo_tecnico.html">
    <div class="card-icon">🔧</div>
    <div class="card-title">RFO Técnico</div>
    <div class="card-desc">Relatório de manutenção para técnicos de campo</div>
    <div class="card-badge">Equipe Técnica</div>
  </a>
  <a class="card lider" href="fiscal_v2.html">
    <div class="card-icon">💻</div>
    <div class="card-title">Fiscalização</div>
    <div class="card-desc">Relatório fotográfico e auditoria para liderança</div>
    <div class="card-badge">🔒 Liderança</div>
  </a>
</div>
<footer>Netturbo O&amp;M © 2026</footer>
</body>
</html>
